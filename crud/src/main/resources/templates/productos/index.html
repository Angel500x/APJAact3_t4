<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>
</head>
<body>
    <h1>Gestión de Productos</h1>
    <a href="/productos/nuevo">Crear Nuevo Producto</a>
    <br/><br/>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${'$' + p.precio}"></td>
                <!-- Se muestra el nombre de la categoría asignada, no solo el ID -->
                <td th:text="${p.categoria != null ? p.categoria.nombre : 'Sin Categoría'}"></td>
                <td>
                    <a th:href="@{/productos/editar/{id}(id=${p.id})}">Editar</a>
                    |
                    <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" 
                       onclick="return confirm('¿Seguro que deseas eliminar este producto?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
